server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'sha256-nJkjTG8i3af8EbWBX1S+oPMQe2+bBezLhlVYQh31zmY='; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
    location = /healthz { default_type text/plain; return 200 "ok\n"; }
    location = /planos { return 302 /#planos; }
    location /assets/ { try_files $uri =404; expires 1h; }
    error_page 404 /404.html;
    location = /404.html { internal; }
    location ~ (\.corrompido|\.bak$|/\.) { return 404; }
    location / { try_files $uri $uri/ $uri.html =404; }
}
